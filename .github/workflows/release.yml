# Publishes a downloadable build when a version tag is pushed.
#
#   1. Bump CFBundleShortVersionString in Resources/Info.plist
#   2. git commit
#   3. git tag v1.1 && git push origin v1.1
#
# The tag and the plist must agree — the job fails early if they don't, so a
# release can never be published under a version the app doesn't report.
#
# Run it by hand from the Actions tab to build without publishing anything.
# That is the way to check a change to the packaging before spending a tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        # Package.swift needs swift-tools-version 6.0, and the image default
        # is not always the newest installed. Picking the highest version
        # keeps this working as the runner images move on.
        run: |
          NEWEST="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$NEWEST"
          swift --version

      - name: Read the version, and check any tag agrees with it
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          echo "VERSION=$PLIST_VERSION" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Manual run — building $PLIST_VERSION without publishing."
            exit 0
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PLIST_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag is $GITHUB_REF_NAME (version $TAG_VERSION) but Info.plist says $PLIST_VERSION." >&2
            echo "Bump CFBundleShortVersionString, commit, and re-tag." >&2
            exit 1
          fi

      - name: Build and package
        # No DEVELOPER_ID or NOTARY_PROFILE, so this signs ad-hoc. To sign for
        # real, import a Developer ID certificate into a temporary keychain here
        # and set both from repository secrets.
        run: ./Scripts/release.sh

      - name: Keep the build for inspection
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceSmith-${{ env.VERSION }}-unpublished
          path: dist/

      - name: Write the release notes
        if: github.ref_type == 'tag'
        run: |
          # What's new comes from CHANGELOG.md, so the notes describe the
          # release rather than repeating install instructions at someone who
          # has already installed it. A missing section is not fatal — the
          # install half below still stands on its own.
          python3 - <<'EOF' > notes.md
          import os, re
          version = os.environ["VERSION"]
          try:
              text = open("CHANGELOG.md").read()
          except FileNotFoundError:
              text = ""
          match = re.search(
              rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S
          )
          if match and match.group(1).strip():
              print(match.group(1).strip())
              print()
              print("---")
              print()
          EOF

          cat >> notes.md <<'NOTES'
          ## Install

          **One line, nothing to click:**

          ```bash
          curl -fsSL https://raw.githubusercontent.com/idrisay/VoiceSmith/main/install.sh | bash
          ```

          **Or download the .dmg below** and drag VoiceSmith to Applications.

          > [!WARNING]
          > macOS blocks the first launch, and the dialog offers **Move to Bin**.
          > That deletes the app. Click **Done** instead.

          VoiceSmith is not notarised by Apple yet, so macOS says it "could not
          verify" the app. The signature is valid and intact — it simply isn't
          one Apple has countersigned. To get past it:

          1. On the *"VoiceSmith" Not Opened* dialog, click **Done**
          2. Open **System Settings › Privacy & Security**, scroll to
             *"VoiceSmith" was blocked to protect your Mac*, click **Open
             Anyway**, and authenticate
          3. Launch again and click **Open Anyway**

          Once per install, not per launch. The one-line installer avoids all of
          it. Already clicked Move to Bin? Restore the app from the Bin with
          right-click › **Put Back** — nothing about it is broken.

          VoiceSmith runs in the menu bar — no Dock icon, no window.

          ## Upgrading

          Re-run the installer, or replace the app in Applications.

          Because the build isn't signed with a Developer ID certificate, macOS
          treats each version as a different app and **drops the Accessibility
          grant on update**. If double-tap Shift stops working, open System
          Settings › Privacy & Security › Accessibility, remove VoiceSmith with
          the − button, and add it again with +. A stale entry looks enabled
          but grants nothing.
          NOTES

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "VoiceSmith $VERSION" \
            --notes-file notes.md \
            dist/VoiceSmith-"$VERSION".dmg \
            dist/VoiceSmith.zip
